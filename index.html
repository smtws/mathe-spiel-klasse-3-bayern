<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Dschungel-Mathe-Expedition - Mathematik-Lernspiel für die 3. Klasse">
  <title>Dschungel-Mathe-Expedition</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a472a;
      position: fixed;
      top: 0;
      left: 0;
    }

    #game-container {
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* Dynamic viewport height for mobile */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-container canvas {
      max-width: 100%;
      max-height: 100%;
      touch-action: none;
    }

    /* Landscape orientation hint for mobile */
    #orientation-hint {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(26, 71, 42, 0.95);
      z-index: 1000;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffd700;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    #orientation-hint .rotate-icon {
      font-size: 64px;
      margin-bottom: 20px;
      animation: rotate-hint 1.5s ease-in-out infinite;
    }

    @keyframes rotate-hint {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }

    @media screen and (max-width: 900px) and (orientation: portrait) {
      #orientation-hint {
        display: flex;
      }
    }

    #loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a472a 0%, #2d5a3d 50%, #1a472a 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
    }

    #loading-screen h1 {
      color: #ffd700;
      font-size: 2.5rem;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
      margin-bottom: 1rem;
    }

    #loading-screen p {
      color: #90EE90;
      font-size: 1.2rem;
    }

    .loading-dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }

    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }
  </style>
</head>
<body>
  <div id="orientation-hint">
    <div class="rotate-icon">📱</div>
    <h2>Bitte drehe dein Gerät</h2>
    <p>Das Spiel funktioniert am besten im Querformat</p>
  </div>
  <div id="loading-screen">
    <h1>Dschungel-Mathe-Expedition</h1>
    <p class="loading-dots">Lade Abenteuer</p>
  </div>
  <div id="game-container"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
